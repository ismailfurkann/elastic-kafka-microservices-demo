services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      LOGGING_FILE_NAME: /var/log/microservices/user-service.log
    volumes:
      - microservice-logs:/var/log/microservices
    depends_on:
      - kafka

  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      LOGGING_FILE_NAME: /var/log/microservices/order-service.log
    volumes:
      - microservice-logs:/var/log/microservices
    depends_on:
      - kafka

  notification-service:
    build:
      context: ./services/notification-service
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      LOGGING_FILE_NAME: /var/log/microservices/notification-service.log
    volumes:
      - microservice-logs:/var/log/microservices
    depends_on:
      - kafka
      - elasticsearch

  fluent-bit:
    image: fluent/fluent-bit:4.0.11
    container_name: fluent-bit
    restart: unless-stopped
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - microservice-logs:/var/log/microservices:ro
      - fluent-bit-state:/var/lib/fluent-bit
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  elasticsearch-data:
  microservice-logs:
    name: microservice-logs
  fluent-bit-state:
