[SERVICE]
    Flush                     5
    Log_Level                 info
    storage.path              /var/lib/fluent-bit/buffer
    storage.sync              full
    storage.checksum          on
    storage.backlog.mem_limit  10M

[INPUT]
    Name              tail
    Tag               microservices
    Path              /var/log/microservices/*-service.log
    Path_Key          source_file
    Key               log
    DB                /var/lib/fluent-bit/tail.db
    DB.sync           Full
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[OUTPUT]
    Name                     es
    Match                    microservices
    Host                     elasticsearch
    Port                     9200
    Logstash_Format          On
    Logstash_Prefix          microservice-logs
    Suppress_Type_Name       On
    Generate_ID              On
    Retry_Limit              False
    storage.total_limit_size 1G
